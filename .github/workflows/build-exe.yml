name: Build Windows EXE

on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    tags:
      - "v*"                # pushing a version tag publishes a Release

permissions:
  contents: write           # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dtt/requirements.txt
          pip install -r gui/requirements.txt
          pip install pyinstaller

      - name: Build executable (onedir)
        run: pyinstaller --noconfirm DTT-Platform.spec

      - name: Package as zip
        run: Compress-Archive -Path dist/DTT-Platform/* -DestinationPath DTT-Platform-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DTT-Platform-windows
          path: DTT-Platform-windows.zip

      - name: Publish to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DTT-Platform-windows.zip