name: Build Windows EXE

on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    tags:
      - "v*"                # pushing a version tag publishes a Release

permissions:
  contents: write           # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dtt/requirements.txt
          pip install -r gui/requirements.txt
          pip install pyinstaller

      - name: Build single-file executable
        run: >
          pyinstaller --noconfirm --onefile --windowed --name DTT-Platform
          --collect-all PySide6
          --collect-all matplotlib
          --collect-all scipy
          --collect-submodules dtt
          --collect-submodules gui
          gui/main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DTT-Platform-windows
          path: dist/DTT-Platform.exe

      - name: Publish to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DTT-Platform.exe